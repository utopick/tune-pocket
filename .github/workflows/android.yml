name: Android APK

# Builds a debug APK on every push (any branch), and on demand from the Actions tab (Run workflow).
# Download it from the run page under Artifacts.
# A version tag (git tag v1.2.0 && git push origin v1.2.0) also publishes a GitHub Release with the APK
# and the app itself (<name>-<version>.html, the whole app in one file).
on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # to publish the release on a tag
    defaults:
      run:
        working-directory: android # everything Android lives there; the app itself stays at the root
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # The action's default package list includes "tools", which Google removed from the SDK repository;
      # name what Capacitor 6 builds with instead (compileSdk 34).
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      # android/native/ is generated on every build (it is not committed), then given the microphone permissions.
      - name: Create the Android project
        run: npm run android:init

      # Gradle itself (~130 MB) is downloaded by the wrapper. Keep it between runs, use the smaller -bin
      # distribution, give the download 2 minutes instead of 10 s, and retry: services.gradle.org sometimes stalls.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('android/package-lock.json', 'android/package.json') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Download Gradle
        working-directory: android/native
        run: |
          sed -i -e 's/-all\.zip/-bin.zip/' -e 's/^networkTimeout=.*/networkTimeout=120000/' gradle/wrapper/gradle-wrapper.properties
          for i in 1 2 3; do ./gradlew --version && exit 0; echo "Gradle download failed (try $i), retrying"; sleep 15; done
          exit 1

      # With the release key in the repository's secrets: a release build signed with it, numbered by the run,
      # so every new APK installs over the one before and keeps its data. Without it (a fork): a debug build,
      # signed with a throwaway key.
      - name: Build and sign the APK
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          v=$(node -p "require('./package.json').version")
          n=$(node -p "require('./package.json').name")
          sed -i -e "s/versionCode [0-9]*/versionCode ${GITHUB_RUN_NUMBER}/" -e "s/versionName \"[^\"]*\"/versionName \"${v}\"/" native/app/build.gradle
          mkdir -p out
          if [ -n "$KS" ]; then
            npm run android:release
            bt="$ANDROID_HOME/build-tools/34.0.0"
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
            "$bt/zipalign" -p -f 4 native/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
            "$bt/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias "$KS_ALIAS" --ks-pass env:KS_PASS --key-pass env:KS_PASS --out "out/${n}-${v}.apk" "$RUNNER_TEMP/aligned.apk"
            rm -f "$RUNNER_TEMP/release.jks"
            "$bt/apksigner" verify --print-certs "out/${n}-${v}.apk" | grep -i "SHA-256"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: building a debug APK with a throwaway key"
            npm run android:apk
            cp native/app/build/outputs/apk/debug/app-debug.apk "out/${n}-${v}-${GITHUB_RUN_NUMBER}-debug.apk"
          fi
          cp ../index.html "out/${n}-${v}.html"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-apk
          path: android/out/*.apk
          retention-days: 30

      - name: Publish the release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/out/*.apk
            android/out/*.html
          generate_release_notes: true
