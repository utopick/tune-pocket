<!doctype html>
<!--
  TUNE.Pocket - pocket tuner, note detector, scale finder and jam band. One self-contained file, no network requests.
  Sister app of TRACK.Pocket: the base styles and the six themes are shared with tracker.html (the block marked
  "shared with TRACK.Pocket"); keep them in step when one changes.

  Layout of this file
    <head>    theme bootstrap (reads localStorage before first paint), <style>
    <body>    backdrop canvas, header, one <section> per view (tun, det, scl, jam, set), help + welcome dialogs, toast
    <script>  music theory and data, mic + pitch detection, one block per view, boot

  localStorage keys
    tune.theme      dark | light | demo | term | dungeon | dmg
    tune.lang       help language (en | es)                 tune.welcome    "1" once the first-visit dialog was closed
    tune.state      { inst, tun, a4, view, auto, jam: { genre, key, pattern, bpm, mix } }
    customTunings   [{ name, instrument, strings: ["E2" | "82.41", ...] }]  (key kept from LFTuner so old tunings load)
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0d0f12" />
    <script>
      try {
        document.documentElement.dataset.theme = localStorage.getItem("tune.theme") || "dark";
      } catch {}
    </script>
    <title>TUNE.Pocket tuner</title>
    <style>
      /* ===================== shared with TRACK.Pocket (base, pocket layout, themes) ===================== */
      :root { --bg: #0d0f12; --panel: #161a20; --panel2: #1d222a; --line: #2a313b; --text: #e8ecf1; --dim: #8a94a3; --acc: #7cf29a; --acc2: #ffb347; --hot: #ff5e7a; --blue: #6ab7ff; --r: 10px; --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace; --ink: #082012; --ink2: #1b1000; --beat: #1a1f27; --playbg: #24402e; --playbg2: #1f5133; --wave: #0a0c0f; --scope: #ffb347; --tie: #1d2a22; --lcn: #232a35; --hi: #fff; --blink: #35404f; }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 15px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overscroll-behavior: none; }
      body { display: flex; flex-direction: column; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); user-select: none; -webkit-user-select: none; }
      header { display: flex; align-items: center; gap: 8px; padding: 10px 12px 6px; }
      .mark { background: none; border: 0; padding: 0; min-height: 0; min-width: 0; text-align: left; display: flex; flex-direction: column; line-height: 1; color: var(--text); border-radius: 6px; }
      .mark .t { font-weight: 900; font-size: 22px; letter-spacing: 0.5px; }
      .mark b { color: var(--acc); }
      .mark .sub { display: none; font-size: 11px; font-weight: 800; letter-spacing: 2.5px; text-transform: uppercase; color: var(--acc2); margin-top: 3px; }
      .grow { flex: 1; }
      button, select, input { font: inherit; color: var(--text); }
      button { background: var(--panel2); border: 1px solid var(--line); border-radius: var(--r); padding: 8px 10px; min-height: 40px; min-width: 40px; cursor: pointer; touch-action: manipulation; }
      button:active { transform: scale(0.96); }
      button.on { background: var(--acc); color: var(--ink); border-color: var(--acc); font-weight: 700; }
      button.rec.on { background: var(--hot); border-color: var(--hot); color: #fff; }
      button.big { font-size: 18px; min-width: 52px; }
      select, input[type="number"], input[type="text"] { background: var(--panel2); border: 1px solid var(--line); border-radius: var(--r); padding: 7px 8px; min-height: 40px; max-width: 100%; }
      input[type="range"] { accent-color: var(--acc); width: 100%; }
      .bpm { display: flex; align-items: center; gap: 4px; font-family: var(--mono); font-size: 13px; color: var(--dim); }
      .bpm input { width: 62px; text-align: center; }
      main { flex: 1; overflow: hidden; position: relative; }
      section { position: absolute; inset: 0; display: none; flex-direction: column; overflow: hidden; }
      .bar { display: flex; gap: 6px; padding: 6px 8px; align-items: center; flex-wrap: wrap; }
      .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--dim); }
      .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px; margin: 8px; }
      @keyframes blink {
              50% {
                background: var(--blink);
              }
            }
      .hint { color: var(--dim); font-size: 12px; line-height: 1.4; }
      #toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--acc); color: #000; padding: 8px 14px; border-radius: 20px; font-weight: 600; opacity: 0; transition: 0.25s; pointer-events: none; z-index: 9; }
      [hidden] { display: none !important; }
      :root { --bh: 44px; --chn: 4; }
      @supports (height: 100dvh) {
        html, body { height: 100dvh; }
      }
      .pk-only { display: none; }
      body.pocket { max-width: 520px; width: 100%; margin: 0 auto; }
      @media (min-width: 760px) {
        html { background: var(--bg); }

        button:not(:disabled):hover { filter: brightness(1.18); }
      }
      body.pocket .pk-only { display: flex; }
      body.pocket .mark .sub { display: block; }
      body.pocket header { padding: 6px 6px; gap: 4px; height: 56px; flex: none; }

      body.pocket .bpm { flex-direction: column; gap: 1px; align-items: center; justify-content: center; margin-left: 8px; }
      body.pocket .bpm .bl { font-size: 9px; letter-spacing: 1.5px; line-height: 1; }
      body.pocket .bpm input { width: 52px; min-height: 32px; padding: 1px; font-size: 16px; font-weight: 800; border-radius: 6px; }
      .ic { width: 21px; height: 21px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; flex: none; }
      #hViews { flex: 1; min-width: 0; gap: 2px; justify-content: center; }
      #hViews button { flex: 1 1 0; min-width: 0; max-width: 38px; height: 44px; min-height: 0; padding: 0; border-radius: 6px; display: flex; align-items: center; justify-content: center; }

      body.pocket #play, body.pocket #rec { width: 34px; font-size: 17px; }

      body.pocket #rec { order: 2; }
      @media (max-width: 370px) {
        body.pocket .mark .sub { display: none; }

        body.pocket .bpm { margin-left: 4px; }
      }
      body.pocket button, body.pocket select, body.pocket input[type="number"], body.pocket input[type="text"] { border-radius: 6px; }

      .prow { display: flex; gap: 4px; padding: 0 6px; height: var(--bh); flex: none; align-items: stretch; }
      .prow > button, .prow > .dd { height: 100%; min-height: 0; min-width: 0; border-radius: 6px; }
      .prow > button { display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1; font-size: 13px; font-weight: 700; padding: 0 4px; white-space: nowrap; overflow: hidden; flex: 1; }
      button i, .dd span i { display: block; font-style: normal; font-size: 8px; letter-spacing: 1px; color: var(--dim); font-weight: 700; line-height: 1.1; }
      button.on i { color: var(--ink); }
      .dd { position: relative; display: flex; align-items: center; justify-content: center; background: var(--panel2); border: 1px solid var(--line); overflow: hidden; flex: 1; }
      .dd span { pointer-events: none; font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 5px; text-align: center; max-width: 100%; line-height: 1.1; }
      .dd select { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; font-size: 16px; min-height: 0; }

      .dd.on span i { color: var(--ink); }
      .dd.inf { pointer-events: none; background: var(--panel); }
      body.pocket main > section > .bar { height: var(--bh); padding: 0 6px; flex-wrap: nowrap; align-items: stretch; flex: none; }
      body.pocket main > section > .bar > * { min-height: 0; height: 100%; border-radius: 6px; }
      body.pocket main > section > .bar .lbl { display: none; }
      body.pocket main > section > .bar select { flex: 1; min-width: 0; }
      body.pocket main > section > .bar button { flex: 1; }
      .sq { position: relative; border-radius: 8px; background: var(--panel); border: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; min-width: 0; min-height: 0; overflow: hidden; font-family: var(--mono); color: var(--dim); --v: 0.7; }
      .sq.beat { background: var(--beat); }
      .sq .st { position: absolute; top: 3px; left: 5px; font-size: 9px; opacity: 0.55; }
      .sq .nt { font-size: 21px; font-weight: 800; line-height: 1; max-width: 96%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .sq .nt.dn { font-size: 15px; }
      .sq .in { font-size: 9px; letter-spacing: 0.6px; opacity: 0.8; line-height: 1.1; white-space: nowrap; }
      .sq > i { position: absolute; left: 0; bottom: 0; height: 4px; background: rgb(var(--ccrgb)); width: 0; }
      .sq.has { color: var(--text); background: rgba(var(--ccrgb), calc(0.12 + var(--v) * 0.18)); border-color: rgba(var(--ccrgb), 0.7); }
      .sq.has .in { color: rgb(var(--ccrgb)); }
      .sq.sel { outline: 2px solid var(--hi); outline-offset: -3px; }
      .sq.play { background: rgba(var(--ccrgb), 0.5); border-color: rgb(var(--ccrgb)); color: var(--text); }
      .sq.has.play { background: rgb(var(--ccrgb)); color: var(--chink, #06100a); }
      .sq.has.play .in { color: #06100a; }
      .sq.play::before { content: "\25B6"; position: absolute; top: 3px; right: 5px; font-size: 9px; color: var(--text); }
      .sq.has.play::before { color: #06100a; }
      .sq.empty { opacity: 0.45; border-style: dashed; }
      .sq.empty .nt { font-size: 26px; font-weight: 600; }
      @keyframes wob {
              to {
                transform: scale(0.94);
              }
            }
      .rib { gap: 3px; margin: 3px 0 6px; }
      .rib button { padding: 0 !important; font-size: 8px !important; border-radius: 6px; }
      .rib button b { display: flex; align-items: center; justify-content: center; height: 22px; font-size: 15px; font-weight: 800; line-height: 1; }
      .rib button i { font-size: 7.5px; letter-spacing: 0.4px; }
      .rib button.dis { opacity: 0.35; pointer-events: none; }
      .rib button.on { background: var(--acc); color: var(--ink); border-color: var(--acc); }
      .rib button.on i { color: var(--ink); }
      .rib button.rec.on { background: var(--hot); border-color: var(--hot); color: #fff; }
      .rib button.rec.on i { color: #fff; }
      .rib button.rec b { color: var(--hot); }
      .rib button.rec.on b { color: #fff; }
      body.pocket #toast { bottom: calc(74px + env(safe-area-inset-bottom)); }
      #wm { position: absolute; left: 0; right: 0; top: 37.5%; transform: translateY(-50%); text-align: center; white-space: nowrap; overflow: hidden; font-weight: 900; font-size: min(18vw, 118px); line-height: 1; letter-spacing: 0.04em; color: var(--text); opacity: 0.05; pointer-events: none; user-select: none; z-index: 4; }
      #bgfx { position: fixed; inset: 0; width: 100%; height: 100%; z-index: -1; display: none; image-rendering: pixelated; pointer-events: none; }
      @media (min-width: 760px) {
        #bgfx { display: block; }
      }
      html[data-theme="term"] { --bg: #030708; --panel: #061215; --panel2: #0a2024; --line: #12868b; --text: #c8fbff; --dim: #4aa3a8; --acc: #19f0e6; --acc2: #ff7a45; --hot: #ff4d5e; --blue: #ffd23f; --r: 2px; --ink: #001416; --ink2: #1a0a00; --beat: #081a1d; --playbg: #0f3d40; --playbg2: #145b5d; --wave: #020a0b; --scope: #ff7a45; --tie: #0c2d30; --lcn: #0c2428; --hi: #ffd23f; --blink: #14585a; --mono: ui-monospace, "Cascadia Mono", "SF Mono", Menlo, Consolas, monospace; }
      html[data-theme="term"] * { border-radius: 2px !important; }
      html[data-theme="term"] body { font-family: var(--mono); text-shadow: 0 0 5px rgba(25, 240, 230, 0.25); }

      html[data-theme="term"] body::after { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 60; background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.2) 0 1px, transparent 1px 3px), radial-gradient(ellipse at center, transparent 60%, rgba(0, 0, 0, 0.45) 100%); }
      html[data-theme="term"] button { border: 1px solid var(--line); background: var(--panel2); color: var(--text); }
      html[data-theme="term"] button.on { background: var(--acc); color: var(--ink); text-shadow: none; border-color: var(--acc); }
      html[data-theme="term"] button:active { background: var(--playbg); }
      html[data-theme="term"] select, html[data-theme="term"] input[type="number"], html[data-theme="term"] input[type="text"] { border: 1px solid var(--line); background: #020b0d; color: var(--acc); }
      html[data-theme="term"] header { position: relative; margin-bottom: 7px; }

      html[data-theme="term"] .mark { padding: 1px 4px 1px 3px; }

      html[data-theme="term"] .mark .t::after { content: ""; display: inline-block; width: 0.42em; height: 0.72em; margin-left: 2px; vertical-align: baseline; background: var(--acc2); animation: blinkc 1.05s steps(1) infinite; }
      html[data-theme="term"] .mark b { display: none; }
      html[data-theme="term"] .mark .sub { color: var(--acc2); }
      html[data-theme="term"] .card, html[data-theme="term"] .wc, html[data-theme="term"] .hp { border: 1px solid var(--line); box-shadow: inset 0 0 0 1px #04282b; }
      html[data-theme="term"] .wc { border-color: var(--acc2); }
      html[data-theme="term"] .sq { border: 1px solid #0b4a4e; }

      html[data-theme="term"] .hb h3 { color: var(--acc); }

      @keyframes blinkc {
              50% {
                opacity: 0;
              }
            }
      @media (prefers-reduced-motion: reduce) {
        html[data-theme="term"] .mark .t::after { animation: none; }
      }
      #help, #welcome { position: fixed; inset: 0; z-index: 80; background: rgba(0, 0, 0, 0.62); display: flex; justify-content: center; }
      #help[hidden], #welcome[hidden] { display: none; }
      .hp { width: 100%; max-width: 600px; height: 100%; background: var(--bg); display: flex; flex-direction: column; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
      .hh { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); flex: none; }
      .hh b { font-size: 18px; flex: 1; }

      .hn button { flex: 1 1 auto; min-height: 34px; padding: 4px 10px; font-size: 13px; }

      .hb h3 { font-size: 19px; margin: 22px 0 6px; color: var(--acc); }

      html[data-theme="demo"] .hb h3 { text-shadow: 2px 2px 0 #000; }
      html[data-theme="dungeon"] { --bg: #0f0d0b; --panel: #1a1612; --panel2: #26201a; --line: #4a3d2c; --text: #e9d9b4; --dim: #9a8562; --acc: #d9a648; --acc2: #a8392c; --hot: #d0452f; --blue: #8aa6b8; --r: 3px; --ink: #1a1206; --ink2: #f6e8c8; --beat: #211b15; --playbg: #3b2a12; --playbg2: #4e3716; --wave: #0a0807; --scope: #d9a648; --tie: #2a2118; --lcn: #211b15; --hi: #ffe7a6; --blink: #3d3224; --chink: #160e05;  --chc: 217, 166, 72 / 196, 78, 60 / 143, 160, 92 / 138, 166, 184 / 154, 116, 172 / 214, 198, 164; --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif; }
      @media (min-width: 760px) {
        html[data-theme="dungeon"] { background: #060504; }

      /* ===================== TUNE.Pocket ===================== */
      html[data-theme="dungeon"] { --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; }
      section {
        gap: 4px;
        padding: 4px 6px 6px;
      }
      section.show {
        display: flex;
      }
      section .prow {
        padding: 0;
      }
      .dd span b {
        font-weight: 800;
      }
      .dd input[type="number"] {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
        background: none;
        text-align: center;
        padding: 12px 0 0;
        font: 800 15px var(--mono);
        min-height: 0;
      }
      .dd .cap {
        position: absolute;
        top: 4px;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 8px;
        letter-spacing: 1px;
        font-weight: 700;
        color: var(--dim);
        pointer-events: none;
      }
      .scroll {
        overflow-y: auto;
        flex: 1;
        min-height: 0;
        touch-action: pan-y;
        -webkit-overflow-scrolling: touch;
      }
      #toast {
        z-index: 70;
      }
      /* the big readout: tuner and detector */
      .disp {
        position: relative;
        flex: 1;
        min-height: 150px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        border-radius: 8px;
        background: var(--panel);
        border: 1px solid var(--line);
        overflow: hidden;
        transition: border-color 0.2s, box-shadow 0.2s;
        --st: var(--dim);
      }
      .disp canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      .disp > :not(canvas) {
        position: relative;
      }
      .disp.flat {
        --st: var(--acc2);
      }
      .disp.sharp {
        --st: var(--hot);
      }
      .disp.ok {
        --st: var(--acc);
        border-color: var(--acc);
        box-shadow:
          0 0 0 1px var(--acc),
          0 0 26px -6px var(--acc);
      }
      .note {
        display: flex;
        align-items: flex-start;
        font: 900 clamp(64px, 25vw, 132px) / 0.9 var(--mono);
        color: var(--st);
        letter-spacing: -2px;
        transition: color 0.15s;
      }
      .note sup {
        font-size: 0.36em;
        line-height: 1;
        margin-top: 0.12em;
      }
      .note sub {
        font-size: 0.3em;
        align-self: flex-end;
        color: var(--dim);
        margin-left: 2px;
      }
      .freq {
        font: 700 14px var(--mono);
        color: var(--dim);
        margin-top: 4px;
      }
      .stat {
        font: 800 12px var(--mono);
        letter-spacing: 2px;
        color: var(--st);
        margin-top: 8px;
        min-height: 15px;
      }
      /* cents meter */
      .meter {
        width: 88%;
        margin-top: 12px;
      }
      .mtrack {
        position: relative;
        height: 30px;
        border-radius: 6px;
        background: var(--panel2);
        border: 1px solid var(--line);
        overflow: hidden;
      }
      .mtrack .zone {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 45%;
        width: 10%;
        background: rgba(124, 242, 154, 0.14);
        background: color-mix(in srgb, var(--acc) 18%, transparent);
      }
      .mtrack .tick {
        position: absolute;
        top: 30%;
        bottom: 30%;
        width: 1px;
        background: var(--line);
      }
      .mtrack .tick.c {
        top: 0;
        bottom: 0;
        width: 2px;
        margin-left: -1px;
        background: var(--dim);
      }
      .needle {
        position: absolute;
        top: 3px;
        bottom: 3px;
        left: 50%;
        width: 6px;
        margin-left: -3px;
        border-radius: 3px;
        background: var(--st);
        box-shadow: 0 0 10px var(--st);
        transition:
          left 0.08s linear,
          background 0.15s;
      }
      .disp.idle .needle {
        opacity: 0.25;
      }
      .mscale {
        display: flex;
        justify-content: space-between;
        font: 700 9px var(--mono);
        color: var(--dim);
        margin-top: 3px;
      }
      /* pads: strings, scale notes, genres, steps */
      .pads {
        display: grid;
        gap: 4px;
        flex: none;
      }
      .pads .sq {
        min-height: 54px;
        cursor: pointer;
      }
      .pads .sq:active {
        transform: scale(0.96);
      }
      .sq .nt sup {
        font-size: 0.6em;
      }
      .sq .nt sub {
        font-size: 0.55em;
        opacity: 0.7;
      }
      .sq.ok {
        background: rgb(var(--ccrgb));
        color: var(--chink, #06100a);
        border-color: rgb(var(--ccrgb));
        box-shadow: 0 0 16px -2px rgb(var(--ccrgb));
      }
      .sq.ok .in {
        color: var(--chink, #06100a);
      }
      #strings {
        grid-template-columns: repeat(var(--n, 6), 1fr);
      }
      #strings .sq {
        min-height: 64px;
      }
      /* scales */
      #sclNotes {
        grid-template-columns: repeat(var(--n, 7), 1fr);
      }
      .fb {
        flex: 1;
        min-height: 150px;
        display: grid;
        grid-template-columns: 24px repeat(13, 1fr);
        grid-template-rows: repeat(var(--n, 6), 1fr) 14px;
        border-radius: 8px;
        background: var(--panel);
        border: 1px solid var(--line);
        padding: 6px 6px 2px 2px;
        overflow: hidden;
      }
      .fb .lab {
        display: flex;
        align-items: center;
        justify-content: center;
        font: 800 11px var(--mono);
        color: var(--dim);
      }
      .fb .fc {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        border-right: 2px solid var(--line);
        min-width: 0;
      }
      .fb .fc.nut {
        border-right: 4px solid var(--dim);
      }
      .fb .fc::before {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        top: 50%;
        height: var(--sw, 1px);
        background: var(--dim);
        opacity: 0.6;
      }
      .fb .dot {
        position: relative;
        width: min(22px, 92%);
        aspect-ratio: 1;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font: 800 8.5px var(--mono);
        color: var(--ink);
        background: var(--blue);
        cursor: pointer;
      }
      .fb .dot.root {
        background: var(--acc);
        box-shadow: 0 0 8px -1px var(--acc);
      }
      .fb .dot.hit {
        transform: scale(1.25);
        background: var(--hi);
      }
      .fb .fn {
        font: 700 9px var(--mono);
        color: var(--dim);
        text-align: center;
      }
      .desc {
        flex: none;
        padding: 8px 10px;
        border-radius: 8px;
        background: var(--panel);
        border: 1px solid var(--line);
        font-size: 12px;
        line-height: 1.45;
        color: var(--dim);
        max-height: 82px;
        overflow-y: auto;
        touch-action: pan-y;
      }
      /* jam */
      #genres {
        grid-template-columns: repeat(4, 1fr);
        flex: 1;
        grid-auto-rows: 1fr;
        min-height: 120px;
      }
      #genres .sq .nt {
        font-size: 15px;
        font-family: system-ui, -apple-system, sans-serif;
      }
      #steps {
        grid-template-columns: repeat(16, 1fr);
        gap: 2px;
      }
      #steps .sq {
        min-height: 40px;
        gap: 0;
        font-size: 9px;
        border-radius: 4px;
        cursor: default;
      }
      #steps .sq.beat {
        border-color: var(--dim);
      }
      #steps .sq b {
        display: block;
        width: 60%;
        height: 4px;
        border-radius: 2px;
        margin: 1px 0;
        background: transparent;
      }
      #steps .sq b.k {
        background: var(--acc2);
      }
      #steps .sq b.s {
        background: var(--hot);
      }
      #steps .sq b.h {
        background: var(--blue);
      }
      #steps .sq b.o {
        background: var(--blue);
        outline: 1px solid var(--hi);
      }
      #steps .sq.now {
        background: var(--acc);
        border-color: var(--acc);
      }
      .knob {
        flex: 1;
        min-width: 0;
        display: grid;
        grid-template-columns: auto 1fr;
        grid-template-rows: auto 1fr;
        align-items: center;
        column-gap: 6px;
        padding: 3px 8px 2px;
        background: var(--panel2);
        border: 1px solid var(--line);
        border-radius: 6px;
      }
      .knob i {
        font-style: normal;
        font-size: 8px;
        letter-spacing: 1px;
        font-weight: 700;
        color: var(--dim);
      }
      .knob b {
        justify-self: end;
        font: 800 12px var(--mono);
        color: var(--acc);
      }
      .knob input {
        grid-column: 1 / -1;
        min-height: 0;
        height: 18px;
        margin: 0;
        padding: 0;
        border: 0;
        background: none;
      }
      /* detector */
      #det .disp .note {
        font-size: clamp(56px, 22vw, 116px);
      }
      .vol {
        position: relative;
        height: 8px;
        flex: none;
        border-radius: 4px;
        background: var(--panel2);
        border: 1px solid var(--line);
        overflow: hidden;
      }
      .vol i {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 0;
        background: linear-gradient(90deg, var(--acc), var(--acc2) 75%, var(--hot));
        transition: width 0.06s linear;
      }
      /* setup */
      #set .card {
        margin: 0 0 6px;
      }
      #set h3 {
        margin: 0 0 8px;
        font-size: 11px;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        color: var(--dim);
      }
      .row {
        display: flex;
        gap: 4px;
        align-items: center;
        margin-bottom: 4px;
      }
      .row > input,
      .row > select {
        flex: 1;
        min-width: 0;
      }
      .row .ix {
        width: 18px;
        text-align: center;
        font: 700 10px var(--mono);
        color: var(--dim);
      }
      .row .ok-mark {
        width: 18px;

        font-size: 12px;
      }

        align-items: center;

        padding: 6px 0;

        flex: 1;

      }

        display: block;
        font-size: 13px;
      }

        display: block;

      }

        font-weight: 700;
        font-size: 13px;
      }

        display: grid;
        grid-template-columns: repeat(3, 1fr);

        gap: 0;
      }

        flex: 1;
        min-height: 0;
        overflow-y: auto;
        touch-action: pan-y;
        margin: 0 0 6px;
      }
      #set .list {
        min-height: 96px; /* the list stays visible above an open panel */
      }
      #set .fpanel {
        flex: 0 1 auto;
        min-height: 0;
        max-height: 72%;
        overflow: auto;
        touch-action: pan-y;
        margin: 0 0 6px;
      }
      #setTabs {
        margin: 0 0 0;
      }
      .saved.cur b {
        color: var(--acc);
      }
      #savedList .grp {
        font: 700 9px var(--mono);
        letter-spacing: 1px;
        color: var(--dim);
      }

      #hViews button,
      #hSet {
        flex: 1 1 0;
        min-width: 0;
        max-width: 38px;
        height: 44px;
        min-height: 0;
        padding: 0;
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #hViews button.on,
      #hSet.on {
        background: var(--acc);
        border-color: var(--acc);
        color: var(--ink);
      }
      #hSet {
        order: 3;
        flex: none;
        width: 34px;
      }

        .pads .sq {
          min-height: 44px;
        }
        #strings .sq {
          min-height: 50px;
        }
        .note {
          font-size: clamp(54px, 19vw, 100px);
        }

        straight4: [0,null,0,null,7,null,null,null,0,null,5,null,7,null,null,null],
        shuffle: [0,null,null,7,null,null,0,null,0,null,null,7,null,null,0,null],
        funk16: [0,null,0,null,null,7,null,null,0,null,null,5,null,0,null,7],
        reggae: [null,null,null,null,0,null,7,null,null,null,null,null,0,null,7,null],
        metal: [0,0,null,0,0,null,0,null,0,null,0,null,0,5,7,0],
        swing: [0,null,7,null,5,null,7,null,0,null,7,null,5,null,7,null],
        bossa: [0,null,null,null,7,null,null,null,0,null,null,null,5,null,null,null],
        boombap: [0,null,null,null,null,null,7,null,0,null,null,null,null,5,null,null],
      };
      // [step, intervals of the chord above the key]; major chords, made minor by MINOR (3rds lowered)
      const CHORD_PATTERNS = {
        straight4: [[0,[0,4,7]],[4,[5,9,12]],[8,[7,11,14]],[12,[5,9,12]]],
        shuffle: [[0,[0,4,7]],[4,[5,9,12]],[8,[0,4,7]],[12,[7,11,14]]],
        funk16: [[0,[0,4,7]],[6,[5,9,12]],[10,[7,11,14]],[14,[5,9,12]]],
        reggae: [[2,[0,4,7]],[6,[5,9,12]],[10,[0,4,7]],[14,[7,11,14]]],
        metal: [[0,[0,7]],[4,[0,5]],[8,[0,7]],[12,[0,3]]],
        swing: [[0,[0,4,7,11]],[4,[5,9,12,16]],[8,[7,11,14]],[12,[5,9,12]]],
        bossa: [[0,[0,4,7,11]],[4,[5,9,12,14]],[8,[7,11,14,17]],[12,[5,9,12,16]]],
        boombap: [[0,[0,3,7]],[8,[5,8,12]]],
      };

      // ======================================================================
      // state (saved in tune.state)
      // ======================================================================
      const S = {
        view: "tun",
        inst: "guitar",
        tun: 0,
        auto: true, // tuner follows the nearest string; off = locked to the selected one
        sel: -1, // selected string
        a4: 440,
        scl: { root: "A", type: "Pentatonic Minor", oct: 3 },
        jam: { genre: "rock", key: "A", pattern: "straight4", bpm: 100, minor: false, mix: { drums: 0.8, bass: 0.6, chord: 0.35 } },
      };
      let customTunings = [];
      try {
        customTunings = JSON.parse(localStorage.getItem("customTunings") || "[]");
        const o = JSON.parse(localStorage.getItem("tune.state") || "{}");
        for (const k of ["view", "inst", "tun", "auto", "a4"]) if (k in o) S[k] = o[k];
        if (o.scl) Object.assign(S.scl, o.scl);
        if (o.jam) Object.assign(S.jam, o.jam, { mix: Object.assign(S.jam.mix, o.jam.mix) });
      } catch {}
      A4 = S.a4;
      function saveState() {
        try {
          localStorage.setItem("tune.state", JSON.stringify({ view: S.view, inst: S.inst, tun: S.tun, auto: S.auto, a4: S.a4, scl: S.scl, jam: S.jam }));
        } catch {}
      }

      // ======================================================================
      // audio: one context, tones, microphone
      // ======================================================================
      let ctx = null;
      async function getCtx() {
        // No forced sample rate: Android WebView refuses to connect a 48 kHz mic stream to a 44.1 kHz context.
        if (!ctx || ctx.state === "closed") ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (ctx.state !== "running") await ctx.resume().catch(() => {});
        return ctx;
      }
      function playTone(hz, dur = 1.6, type = "triangle", vol = 0.25) {
        getCtx().then((c) => {
          const t = c.currentTime,
            o = c.createOscillator(),
            o2 = c.createOscillator(),
            g = c.createGain();
          o.type = type;
          o2.type = "sine";
          o.frequency.value = hz;
          o2.frequency.value = hz * 2;
          const g2 = c.createGain();
          g2.gain.value = 0.25;
          o.connect(g);
          o2.connect(g2).connect(g);
          g.connect(c.destination);
          g.gain.setValueAtTime(0.0001, t);
          g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
          g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
          o.start(t);
          o2.start(t);
          o.stop(t + dur + 0.05);
          o2.stop(t + dur + 0.05);
        });
      }

      const MIC = { on: false, stream: null, an: null, buf: new Float32Array(4096), raf: 0 };
      async function micStart() {
        if (MIC.on) return;
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return micError("NO_API");
        try {
          const c = await getCtx();
          MIC.stream = await navigator.mediaDevices.getUserMedia({
            audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false },
            video: false,
          });
          await c.resume().catch(() => {}); // iOS / Android can suspend the context during the permission prompt
          const src = c.createMediaStreamSource(MIC.stream);
          MIC.an = c.createAnalyser();
          MIC.an.fftSize = 4096;
          src.connect(MIC.an);
          MIC.on = true;
          micFace();
          MIC.raf = requestAnimationFrame(micLoop);
        } catch (e) {
          micError(e.name || "UNKNOWN");
        }
      }
      function micStop() {
        MIC.on = false;
        cancelAnimationFrame(MIC.raf);
        if (MIC.stream) MIC.stream.getTracks().forEach((t) => t.stop());
        MIC.stream = MIC.an = null;
        micFace();
        tunIdle();
        detIdle();
      }
      const micToggle = () => (MIC.on ? micStop() : micStart());
      function micError(code) {
        const app = !!window.Capacitor;
        const m = {
          NotAllowedError: app
            ? "Microphone blocked. Allow it in Android Settings → Apps → TUNE.Pocket → Permissions → Microphone."
            : "Microphone blocked. Allow it in the browser's site settings and reload.",
          NotFoundError: "No microphone found.",
          NotReadableError: "The microphone is busy in another app.",
          NO_API: location.protocol === "http:" ? "The microphone needs https (or localhost)." : "This browser has no microphone support.",
        };
        toast(m[code] || "Could not open the microphone (" + code + ")");
      }
      function micFace() {
        $$("#rec, #tMic, #dMic").forEach((b) => b.classList.toggle("on", MIC.on));
      }

      // Autocorrelation pitch detector. Lags are limited to the range a musical note can have,
      // which keeps it cheap enough for every animation frame on a phone.
      function detectPitch(buf, sr, minHz = 28, maxHz = 4200) {
        const N = buf.length;
        let rms = 0;
        for (let i = 0; i < N; i++) rms += buf[i] * buf[i];
        rms = Math.sqrt(rms / N);
        if (rms < 0.006) return { hz: -1, rms };
        const minLag = Math.max(2, Math.floor(sr / maxHz)),
          maxLag = Math.min(N >> 1, Math.ceil(sr / minHz)),
          W = N - maxLag,
          c = new Float32Array(maxLag + 2);
        for (let lag = 0; lag <= maxLag + 1; lag++) {
          let s = 0;
          for (let j = 0; j < W; j++) s += buf[j] * buf[j + lag];
          c[lag] = s;
        }
        // first dip, then the highest peak after it; take the earliest peak close to that height (avoids octave errors)
        let d = minLag;
        while (d < maxLag && c[d] > c[d + 1]) d++;
        let best = -1,
          bv = -Infinity;
        for (let i = d; i <= maxLag; i++) if (c[i] > bv) ((bv = c[i]), (best = i));
        if (best < 0 || bv < c[0] * 0.3) return { hz: -1, rms };
        for (let i = d; i < best; i++)
          if (c[i] > bv * 0.9 && c[i] >= c[i - 1] && c[i] >= c[i + 1]) {
            best = i;
            break;
          }
        let T0 = best;
        const x1 = c[T0 - 1],
          x2 = c[T0],
          x3 = c[T0 + 1],
          a = (x1 + x3 - 2 * x2) / 2,
          b = (x3 - x1) / 2;
        if (a) T0 -= b / (2 * a);
        return { hz: sr / T0, rms };
      }

      let lastHz = -1,
        smoothMidi = null;
      function micLoop() {
        if (!MIC.on) return;
        MIC.an.getFloatTimeDomainData(MIC.buf);
        const lo = S.view === "det" ? +$("#dMin").value || 40 : 28,
          hi = S.view === "det" ? +$("#dMax").value || 1200 : 4200;
        const { hz, rms } = detectPitch(MIC.buf, ctx.sampleRate, lo, hi);
        // light smoothing in pitch space; jump straight to a new note
        if (hz > 0) {
          const m = hzToMidi(hz);
          smoothMidi = smoothMidi == null || Math.abs(m - smoothMidi) > 0.5 ? m : smoothMidi * 0.6 + m * 0.4;
          lastHz = midiToHz(smoothMidi);
        } else {
          smoothMidi = null;
          lastHz = -1;
        }
        if (S.view === "tun") tunFrame(lastHz);
        else if (S.view === "det") detFrame(lastHz, rms);
        MIC.raf = requestAnimationFrame(micLoop);
      }

      // ======================================================================
      // tuner
      // ======================================================================
      const allTunings = () => [...(TUNINGS[S.inst] || []), ...customTunings.filter((t) => t.instrument === S.inst)];
      function curStrings() {
        const t = allTunings()[S.tun] || allTunings()[0];
        return t
          ? t.strings.map((s) => {
              const p = parseNoteString(s) || { hz: 220 },
                i = hzToNoteInfo(p.hz);
              return { note: i.note, octave: i.octave, hz: p.hz };
            })
          : [];
      }
      function renderInst() {
        $("#inst").innerHTML = INSTRUMENTS.map(([id, n]) => `<option value="${id}">${n}</option>`).join("");
        $("#inst").value = S.inst;
        $("#instTxt").innerHTML = `<i>INSTRUMENT</i>${INSTRUMENTS.find((x) => x[0] === S.inst)[1]}`;
        const ts = allTunings();
        if (S.tun >= ts.length) S.tun = 0;
        $("#tuning").innerHTML = ts.map((t, i) => `<option value="${i}">${esc(t.name)}</option>`).join("");
        $("#tuning").value = S.tun;
        $("#tunTxt").innerHTML = `<i>TUNING</i>${esc(ts[S.tun] ? ts[S.tun].name : "—")}`;
        renderStrings();
        renderScale();
        if ($("#savedList")) renderSaved();
      }
      function renderStrings() {
        const ss = curStrings();
        const box = $("#strings");
        box.style.setProperty("--n", ss.length);
        box.innerHTML = ss
          .map(
            (s, i) =>
              `<div class="sq has${i === S.sel ? " sel" : ""}" data-s="${i}" style="--ccrgb:${PC(i)};--v:.25"><span class="st">${i + 1}</span><span class="nt">${pretty(s.note)}<sub>${s.octave}</sub></span><span class="in">${s.hz.toFixed(1)}</span></div>`,
          )
          .join("");
      }
      $("#inst").onchange = (e) => {
        S.inst = e.target.value;
        S.tun = 0;
        S.sel = -1;
        renderInst();
        saveState();
      };
      $("#tuning").onchange = (e) => {
        S.tun = +e.target.value;
        S.sel = -1;
        renderInst();
        saveState();
      };
      $("#strings").onclick = (e) => {
        const p = e.target.closest("[data-s]");
        if (!p) return;
        const i = +p.dataset.s;
        S.sel = i;
        if (S.auto) {
          S.auto = false;
          ribFace();
          toast("Locked on string " + (i + 1) + ". AUTO follows the nearest string.");
        }
        playTone(curStrings()[i].hz);
        renderStrings();
        saveState();
      };

      const trace = []; // last cents readings for the trace behind the meter
      function tunIdle() {
        $("#tunDisp").className = "disp idle";
        $("#tunNote").textContent = "—";
        $("#tunFreq").textContent = MIC.on ? "play a string" : "tap ● to listen";
        $("#tunStat").textContent = "";
        $("#tunNeedle").style.left = "50%";
        $$("#strings .sq").forEach((q) => q.classList.remove("ok"));
      }
      let tunQuiet = 0;
      function tunFrame(hz) {
        if (hz <= 0) {
          if (++tunQuiet > 20) tunIdle(); // keep the last reading for a moment while the string rings out
          trace.push(null);
          drawTrace();
          return;
        }
        tunQuiet = 0;
        const ss = curStrings();
        let ti = S.sel;
        if (S.auto || ti < 0 || ti >= ss.length) {
          let md = Infinity;
          ss.forEach((s, i) => {
            const d = Math.abs(Math.log2(hz / s.hz));
            if (d < md) ((md = d), (ti = i));
          });
          if (ss.length && Math.abs(1200 * Math.log2(hz / ss[ti].hz)) > 300) ti = -1; // far from every string: just show the note
        }
        const tgt = ti >= 0 ? ss[ti] : null,
          info = hzToNoteInfo(hz),
          cents = tgt ? 1200 * Math.log2(hz / tgt.hz) : info.cents,
          cl = Math.max(-50, Math.min(50, cents)),
          ok = Math.abs(cents) <= 4;
        const n = tgt || info;
        $("#tunNote").innerHTML = pretty(n.note) + `<sub>${n.octave}</sub>`;
        $("#tunFreq").textContent = hz.toFixed(2) + " Hz" + (tgt ? " → " + tgt.hz.toFixed(2) : "");
        $("#tunNeedle").style.left = 50 + cl + "%";
        $("#tunDisp").className = "disp " + (ok ? "ok" : cents < 0 ? "flat" : "sharp");
        $("#tunStat").textContent = ok
          ? "✓ IN TUNE"
          : Math.abs(cents) > 50
            ? (cents < 0 ? "▼ WAY FLAT " : "▲ WAY SHARP ") + Math.round(Math.abs(cents)) + "¢"
            : (cents < 0 ? "▼ FLAT " : "▲ SHARP ") + Math.abs(cents).toFixed(0) + "¢";
        $$("#strings .sq").forEach((q, i) => {
          q.classList.toggle("sel", i === ti);
          q.classList.toggle("ok", i === ti && ok);
        });
        trace.push(cl);
        drawTrace();
      }
      function fitCanvas(cv) {
        const r = cv.getBoundingClientRect(),
          d = Math.min(2, devicePixelRatio || 1),
          w = Math.round(r.width * d),
          h = Math.round(r.height * d);
        if (cv.width !== w || cv.height !== h) ((cv.width = w), (cv.height = h));
        return [cv.getContext("2d"), w, h, d];
      }
      // a falling line of the last readings: x = cents, newest at the bottom
      function drawTrace() {
        while (trace.length > 90) trace.shift();
        const [g, w, h, d] = fitCanvas($("#tunTrace"));
        g.clearRect(0, 0, w, h);
        g.lineWidth = 2 * d;
        g.lineCap = "round";
        const col = css("--acc") || "#7cf29a",
          hot = css("--hot") || "#ff5e7a",
          warm = css("--acc2") || "#ffb347",
          mL = w * 0.06,
          mW = w * 0.88;
        for (let i = 1; i < trace.length; i++) {
          const a = trace[i - 1],
            b = trace[i];
          if (a == null || b == null) continue;
          g.globalAlpha = (i / trace.length) * 0.5;
          g.strokeStyle = Math.abs(b) <= 4 ? col : b < 0 ? warm : hot;
          g.beginPath();
          g.moveTo(mL + ((a + 50) / 100) * mW, (h * (i - 1)) / 90);
          g.lineTo(mL + ((b + 50) / 100) * mW, (h * i) / 90);
          g.stroke();
        }
        g.globalAlpha = 1;
      }
      function buildMeter() {
        const t = $("#tunTrack");
        [-40, -30, -20, -10, 0, 10, 20, 30, 40].forEach((v) => {
          const e = document.createElement("div");
          e.className = "tick" + (v ? "" : " c");
          e.style.left = 50 + v + "%";
          t.insertBefore(e, $("#tunNeedle"));
        });
      }

      // ======================================================================
      // detector
      // ======================================================================
      const roll = []; // midi (float) or null per frame
      let detHold = false,
        detLastHz = -1;
      function detIdle() {
        $("#detDisp").className = "disp idle";
        $("#detStat").textContent = MIC.on ? "listening…" : "tap ● to listen";
        $("#vol").style.width = "0";
        if (!detHold) {
          $("#detNote").textContent = "—";
          ["#dFreq", "#dCents", "#dExact"].forEach((s) => ($(s).textContent = "—"));
        }
      }
      function detFrame(hz, rms) {
        $("#vol").style.width = Math.min(100, rms * 500) + "%";
        roll.push(hz > 0 ? hzToMidi(hz) : null);
        while (roll.length > 240) roll.shift();
        drawRoll();
        if (hz <= 0 || detHold) {
          if (!detHold) $("#detDisp").className = "disp idle";
          return;
        }
        detLastHz = hz;
        const i = hzToNoteInfo(hz),
          ok = Math.abs(i.cents) <= 5;
        $("#detNote").innerHTML = pretty(i.note) + `<sub>${i.octave}</sub>`;
        $("#detDisp").className = "disp " + (ok ? "ok" : i.cents < 0 ? "flat" : "sharp");
        $("#detStat").textContent = ok ? "✓ ON PITCH" : (i.cents < 0 ? "▼ " : "▲ ") + Math.abs(i.cents).toFixed(0) + "¢";
        $("#dFreq").textContent = hz.toFixed(1);
        $("#dCents").textContent = (i.cents >= 0 ? "+" : "−") + Math.abs(i.cents).toFixed(1);
        $("#dExact").textContent = midiToHz(i.midi).toFixed(1);
      }
      // piano roll of the last ~4 s: one lane per semitone around the recent notes
      function drawRoll() {
        const [g, w, h, d] = fitCanvas($("#detRoll"));
        g.clearRect(0, 0, w, h);
        const vals = roll.filter((x) => x != null);
        if (!vals.length) return;
        const mid = Math.round(vals.slice(-30).reduce((a, b) => a + b, 0) / Math.min(30, vals.length)),
          lo = mid - 7,
          hi = mid + 7,
          lane = h / (hi - lo + 1),
          y = (m) => h - (m - lo + 0.5) * lane;
        g.font = `700 ${9 * d}px ui-monospace, Menlo, monospace`;
        g.textBaseline = "middle";
        for (let m = lo; m <= hi; m++) {
          const black = [1, 3, 6, 8, 10].includes(((m % 12) + 12) % 12);
          g.fillStyle = black ? "rgba(0,0,0,.18)" : "rgba(255,255,255,.025)";
          g.fillRect(0, y(m) - lane / 2, w, lane);
          if (!black) {
            g.fillStyle = css("--dim");
            g.globalAlpha = 0.6;
            g.fillText(NOTE_NAMES[((m % 12) + 12) % 12] + (Math.floor(m / 12) - 1), 4 * d, y(m));
            g.globalAlpha = 1;
          }
        }
        const col = css("--acc"),
          step = w / 240;
        g.strokeStyle = col;
        g.lineWidth = Math.max(3 * d, lane * 0.45);
        g.lineCap = "round";
        g.shadowColor = col;
        g.shadowBlur = 8 * d;
        g.beginPath();
        let pen = false;
        roll.forEach((m, i) => {
          const x = w - (roll.length - i) * step;
          if (m == null || m < lo - 1 || m > hi + 1) return void (pen = false);
          pen ? g.lineTo(x, y(m)) : g.moveTo(x, y(m));
          pen = true;
        });
        g.stroke();
        g.shadowBlur = 0;
      }
      $("#dHold").onclick = () => {
        detHold = !detHold;
        $("#dHold").classList.toggle("on", detHold);
      };
      $("#dClear").onclick = () => {
        roll.length = 0;
        drawRoll();
      };

      // ======================================================================
      // scales
      // ======================================================================
      function scaleNotes() {
        const ri = NOTE_NAMES.indexOf(S.scl.root);
        return SCALES[S.scl.type][0].map((i) => NOTE_NAMES[(ri + i) % 12]);
      }
      function renderScaleSelects() {
        $("#root").innerHTML = NOTE_NAMES.map((n) => `<option value="${n}">${plain(n)}</option>`).join("");
        $("#stype").innerHTML = Object.keys(SCALES)
          .map((k) => `<option>${k}</option>`)
          .join("");
      }
      function renderScale() {
        if (!SCALES[S.scl.type]) S.scl.type = "Pentatonic Minor";
        $("#root").value = S.scl.root;
        $("#stype").value = S.scl.type;
        $("#rootTxt").innerHTML = `<i>ROOT</i>${plain(S.scl.root)}`;
        $("#typeTxt").innerHTML = `<i>SCALE</i>${S.scl.type}`;
        const notes = scaleNotes(),
          ivs = SCALES[S.scl.type][0],
          DEG = ["1", "♭2", "2", "♭3", "3", "4", "♭5", "5", "♭6", "6", "♭7", "7"];
        const nb = $("#sclNotes");
        nb.style.setProperty("--n", notes.length);
        nb.innerHTML = notes
          .map(
            (n, i) =>
              `<div class="sq has${i ? "" : " sel"}" data-n="${i}" style="--ccrgb:${PC(i ? 2 : 0)};--v:${i ? 0.2 : 0.6}"><span class="nt">${pretty(n)}</span><span class="in">${DEG[ivs[i]]}</span></div>`,
          )
          .join("");
        $("#sclDesc").textContent = SCALES[S.scl.type][1];
        $("#sOct").innerHTML = `<b>${S.scl.oct}</b><i>OCTAVE</i>`;
        // fretboard of the tuner's instrument and tuning, highest string on top
        const ss = curStrings().slice().reverse(),
          fb = $("#fb"),
          MK = [3, 5, 7, 9, 12];
        fb.style.setProperty("--n", ss.length);
        let h = "";
        ss.forEach((s, r) => {
          h += `<div class="lab">${plain(s.note)}</div>`;
          const base = Math.round(hzToMidi(s.hz)),
            sw = 1 + (r / Math.max(1, ss.length - 1)) * 1.5;
          for (let f = 0; f <= 12; f++) {
            const m = base + f,
              nm = NOTE_NAMES[((m % 12) + 12) % 12],
              inS = notes.includes(nm);
            h += `<div class="fc${f ? "" : " nut"}" style="--sw:${sw.toFixed(1)}px">${inS ? `<span class="dot${nm === S.scl.root ? " root" : ""}" data-m="${m}">${plain(nm)}</span>` : ""}</div>`;
          }
        });
        h += `<div></div>` + Array.from({ length: 13 }, (_, f) => `<div class="fn">${MK.includes(f) ? f : f ? "" : "0"}</div>`).join("");
        fb.innerHTML = h;
      }
      $("#root").onchange = (e) => {
        S.scl.root = e.target.value;
        renderScale();
        saveState();
      };
      $("#stype").onchange = (e) => {
        S.scl.type = e.target.value;
        renderScale();
        saveState();
      };
      const sclHz = (i) => {
        const ivs = SCALES[S.scl.type][0];
        return midiToHz((S.scl.oct + 1) * 12 + NOTE_NAMES.indexOf(S.scl.root) + (i < ivs.length ? ivs[i] : 12));
      };
      $("#sclNotes").onclick = (e) => {
        const p = e.target.closest("[data-n]");
        if (p) playTone(sclHz(+p.dataset.n), 0.7);
      };
      $("#fb").onclick = (e) => {
        const p = e.target.closest("[data-m]");
        if (!p) return;
        playTone(midiToHz(+p.dataset.m), 0.9);

      function renderJam() {

      function jamMix() {
        if (!J.g) return;
        J.g.drums.gain.value = S.jam.mix.drums;

        J.g.chord.gain.value = S.jam.mix.chord;

      async function jamStart() {
        const c = await getCtx();
        if (!J.g) {
          const bus = c.createDynamicsCompressor();
          bus.connect(c.destination);
          J.an = c.createAnalyser(); // read by the backdrop
          J.an.fftSize = 2048;
          bus.connect(J.an);
          J.g = { drums: c.createGain(), bass: c.createGain(), chord: c.createGain() };

      let noiseBuf = null;
      function noise(c) {
        if (!noiseBuf) {
          noiseBuf = c.createBuffer(1, c.sampleRate * 0.5, c.sampleRate);
          const d = noiseBuf.getChannelData(0);
          for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
        }
        const s = c.createBufferSource();
        s.buffer = noiseBuf;
        return s;
      }
      function drum(c, type, t, vol) {
        const out = J.g.drums,
          g = c.createGain();
        g.connect(out);
        if (type === "kick") {
          const o = c.createOscillator();
          o.frequency.setValueAtTime(150, t);
          o.frequency.exponentialRampToValueAtTime(32, t + 0.12);
          g.gain.setValueAtTime(vol, t);
          g.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
          o.connect(g);
          o.start(t);
          o.stop(t + 0.25);
        } else if (type === "snare") {
          const n = noise(c),
            f = c.createBiquadFilter();
          f.type = "highpass";
          f.frequency.value = 1200;
          n.connect(f).connect(g);
          g.gain.setValueAtTime(vol * 0.6, t);
          g.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
          n.start(t, Math.random() * 0.3, 0.16);
          const o = c.createOscillator(),
            og = c.createGain();
          o.type = "triangle";
          o.frequency.value = 185;
          og.gain.setValueAtTime(vol * 0.3, t);
          og.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
          o.connect(og).connect(out);
          o.start(t);
          o.stop(t + 0.1);
        } else {
          const open = type === "openhat",
            len = open ? 0.2 : 0.04,
            n = noise(c),
            f = c.createBiquadFilter();
          f.type = "highpass";
          f.frequency.value = 7500;
          n.connect(f).connect(g);
          g.gain.setValueAtTime(vol * (open ? 0.3 : 0.2), t);
          g.gain.exponentialRampToValueAtTime(0.001, t + len);
          n.start(t, Math.random() * 0.3, len + 0.01);
        }
      }
      function bassNote(c, hz, t, vol) {
        const o = c.createOscillator(),
          f = c.createBiquadFilter(),
          g = c.createGain();
        o.type = "sawtooth";
        f.type = "lowpass";
        f.frequency.setValueAtTime(900, t);
        f.frequency.exponentialRampToValueAtTime(220, t + 0.18);
        o.frequency.value = hz;
        g.gain.setValueAtTime(vol, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.24);
        o.connect(f).connect(g).connect(J.g.bass);
        o.start(t);
        o.stop(t + 0.26);
      }
      function chord(c, freqs, t, vol, len) {

            g = c.createGain();
          o.type = "triangle";
          o.frequency.value = hz;
          g.gain.setValueAtTime(0.0001, t);
          g.gain.exponentialRampToValueAtTime(vol / freqs.length, t + 0.01);
          g.gain.exponentialRampToValueAtTime(0.001, t + len);

          o.stop(t + len + 0.02);

      function jamTick() {

          t: { en: "Jam", es: "Jam" },
          b: {
            en: [
              "A drum, bass and chord band to practise over. Tap a **style** pad to start it; tap **▶** or **STOP** to stop.",
              "- **KEY** and **MAJOR / MINOR** set the key the bass and chords play in.",
              "- **PATTERN** changes the groove without changing the style's tempo.",
              "- **BPM** is the tempo; **TAP TEMPO** sets it from three or more taps.",
              "- **DRUMS / BASS / CHORDS** are the mixer.",
              "- The 16 squares are the bar: orange is the kick, red the snare, blue the hi-hat. The lit square is the step playing now.",
            ],
            es: [
              "Una banda de batería, bajo y acordes para practicar encima. Toca un pad de **estilo** para arrancarla; toca **▶** o **STOP** para pararla.",
              "- **KEY** y **MAJOR / MINOR** fijan la tonalidad del bajo y los acordes.",
              "- **PATTERN** cambia el ritmo sin cambiar el tempo del estilo.",
              "- **BPM** es el tempo; **TAP TEMPO** lo fija con tres o más toques.",
              "- **DRUMS / BASS / CHORDS** son el mezclador.",
              "- Los 16 cuadros son el compás: naranja es el bombo, rojo la caja, azul el charles. El cuadro iluminado es el paso que suena.",
            ],
          },
        },
        {
          id: "set",
          t: { en: "Tunings", es: "Afinaciones" },
          b: {
            en: [
              "The last view lists **your tunings** and the **built-in** ones of the tuner's instrument. **USE** sends one to the tuner; the current one is shown in green.",
              "## Your own tunings",
              "- **NEW** (bottom bar) opens the editor. Give the tuning a name and an instrument, and write each string, lowest first, as a note with its octave (*E2*, *F#3*, *Bb1*) or a frequency in Hz (*82.41*). A ✓ or ✕ shows whether each string can be read.",
              "- **COPY** in the editor fills it with the tuner's current tuning; **COPY** on a built-in tuning does the same for that one. Change it and **SAVE**.",
              "- **EDIT** changes one of yours; saving with the same name replaces it. **✕** deletes it after a second tap.",
              "## Theme",
              "**THEME** has the six looks shared with TRACK.Pocket. On a wide screen the background is animated and moves with the band or the microphone.",
              "Tunings and settings are kept on this device. Tunings saved by the old LFTuner app are loaded automatically.",
            ],
            es: [
              "La última vista lista **tus afinaciones** y las **incluidas** para el instrumento del afinador. **USE** la manda al afinador; la actual sale en verde.",
              "## Tus afinaciones",
              "- **NEW** (barra de abajo) abre el editor. Dale un nombre y un instrumento, y escribe cada cuerda, de la más grave a la más aguda, como nota con su octava (*E2*, *F#3*, *Bb1*) o una frecuencia en Hz (*82.41*). Un ✓ o ✕ indica si se puede leer cada cuerda.",
              "- **COPY** en el editor lo rellena con la afinación actual del afinador; **COPY** en una afinación incluida hace lo mismo con esa. Cámbiala y pulsa **SAVE**.",
              "- **EDIT** cambia una de las tuyas; guardar con el mismo nombre la sustituye. **✕** la borra tras un segundo toque.",
              "## Tema",
              "**THEME** tiene los seis aspectos que comparte con TRACK.Pocket. En pantallas anchas el fondo está animado y se mueve con la banda o el micrófono.",
              "Las afinaciones y ajustes se guardan en este dispositivo. Las afinaciones guardadas en la antigua app LFTuner se cargan automáticamente.",
            ],
          },
        },
      ];
      const HELPUI = {
        en: {
          title: "Help",
          close: "Close",
          wb: "Tap the **TUNE.** logo (top left), or **HELP** in the Tunings view, at any time to open the help manual: it explains every view and button.",
          wopen: "Open the manual",
          wok: "Got it",
        },
        es: {
          title: "Ayuda",
          close: "Cerrar",
          wb: "Toca el logo **TUNE.** (arriba a la izquierda), o **HELP** en la vista de afinaciones, en cualquier momento para abrir el manual de ayuda: explica cada vista y cada botón.",
          wopen: "Abrir el manual",
          wok: "Entendido",
        },
      };
      let HLANG = "en";
      try {
        HLANG =
          localStorage.getItem("tune.lang") || ((navigator.language || "en").toLowerCase().startsWith("es") ? "es" : "en");
      } catch {}
      const hfmt = (t) => t.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/\*(.+?)\*/g, "<em>$1</em>");
      function helpRender() {
        const L = HLANG,
          U = HELPUI[L];
        $("#hTitle").textContent = "TUNE.Pocket · " + U.title;
        $("#hClose").title = U.close;
        $$("#help [data-lg]").forEach((b) => b.classList.toggle("on", b.dataset.lg === L));
        $("#hNav").innerHTML = HELP.map((x) => `<button data-hs="${x.id}">${x.t[L]}</button>`).join("");
        $("#hBody").innerHTML = HELP.map((x) => {
          let h = `<h3 id="hs-${x.id}">${x.t[L]}</h3>`,
            ul = false;
          x.b[L].forEach((l) => {
            if (l.startsWith("- ")) {
              if (!ul) ((h += "<ul>"), (ul = true));
              h += `<li>${hfmt(l.slice(2))}</li>`;
              return;
            }
            if (ul) ((h += "</ul>"), (ul = false));
            h += l.startsWith("## ") ? `<h4>${hfmt(l.slice(3))}</h4>` : `<p>${hfmt(l)}</p>`;
          });
          return h + (ul ? "</ul>" : "");
        }).join("");
      }
      // opens on the section of the view you are in
      function openHelp(sec) {
        helpRender();
        $("#help").hidden = false;
        $("#hBody").scrollTop = 0;
        const el = $("#hs-" + (sec || S.view));
        if (el) $("#hBody").scrollTo(0, el.offsetTop - 8);
      }
      const closeHelp = () => ($("#help").hidden = true);
      $("#logo").onclick = () => openHelp();
      $("#helpBtn").onclick = () => openHelp("set");
      $("#hClose").onclick = closeHelp;
      $("#help").addEventListener("click", (e) => {
        if (e.target.id === "help") return closeHelp();
        const l = e.target.closest("[data-lg]");
        if (l) {
          HLANG = l.dataset.lg;
          try {
            localStorage.setItem("tune.lang", HLANG);
          } catch {}
          const y = $("#hBody").scrollTop;
          helpRender();
          $("#hBody").scrollTop = y;
          return;
        }
        const n = e.target.closest("[data-hs]");
        if (n) {
          const el = $("#hs-" + n.dataset.hs);
          el && $("#hBody").scrollTo({ top: el.offsetTop - 8, behavior: "smooth" });
        }
      });
      addEventListener("keydown", (e) => {
        if (e.key === "Escape" && !$("#help").hidden) closeHelp();
      });
      // first visit: a short note in both languages pointing at the manual
      function welcome() {
        $("#wEn").innerHTML = hfmt(HELPUI.en.wb);
        $("#wEs").innerHTML = hfmt(HELPUI.es.wb);
        $("#wOpen").textContent = HELPUI[HLANG].wopen;
        $("#wOk").textContent = HELPUI[HLANG].wok;
        $("#welcome").hidden = false;
      }
      function welcomeDone(open) {
        $("#welcome").hidden = true;
        try {
          localStorage.setItem("tune.welcome", "1");
        } catch {}
        if (open) openHelp("start");
      }
      $("#wOpen").onclick = () => welcomeDone(true);
      $("#wOk").onclick = () => welcomeDone(false);


      // ======================================================================
      // boot
      // ======================================================================
      buildMeter();
      renderScaleSelects();
      $("#a4").value = A4;
      renderInst();
      renderJam();
      renderCustom();
      setTheme(document.documentElement.dataset.theme);
      ribFace();
      tunIdle();
      detIdle();
      showView(S.view);
      try {
        if (!localStorage.getItem("tune.welcome")) welcome();
      } catch {}
    </script>
  </body>
</html>
