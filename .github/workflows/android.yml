name: Android APK

# Builds a debug APK on every push (any branch), and on demand from the Actions tab (Run workflow).
# Download it from the run page under Artifacts.
# A version tag (git tag v1.2.0 && git push origin v1.2.0) also publishes a GitHub Release with the APK
# and the app itself (<name>-<version>.html, the whole app in one file).
on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # to publish the release on a tag
    defaults:
      run:
        working-directory: android # everything Android lives there; the app itself stays at the root
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # The action's default package list includes "tools", which Google removed from the SDK repository;
      # name what Capacitor 6 builds with instead (compileSdk 34).
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      # android/native/ is generated on every build (it is not committed), then given the microphone permissions.
      - name: Create the Android project
        run: npm run android:init

      # Gradle itself (~130 MB) is downloaded by the wrapper. Keep it between runs, use the smaller -bin
      # distribution, give the download 2 minutes instead of 10 s, and retry: services.gradle.org sometimes stalls.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('android/package-lock.json', 'android/package.json') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Download Gradle
        working-directory: android/native
        run: |
          sed -i -e 's/-all\.zip/-bin.zip/' -e 's/^networkTimeout=.*/networkTimeout=120000/' gradle/wrapper/gradle-wrapper.properties
          for i in 1 2 3; do ./gradlew --version && exit 0; echo "Gradle download failed (try $i), retrying"; sleep 15; done
          exit 1

      - name: Build the APK
        run: npm run android:apk

      - name: Name the APK
        run: |
          v=$(node -p "require('./package.json').version")
          n=$(node -p "require('./package.json').name")
          mkdir -p out
          cp native/app/build/outputs/apk/debug/app-debug.apk "out/${n}-${v}-${GITHUB_RUN_NUMBER}-debug.apk"
          cp ../index.html "out/${n}-${v}.html"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-apk
          path: android/out/*.apk
          retention-days: 30

      - name: Publish the release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/out/*.apk
            android/out/*.html
          generate_release_notes: true
